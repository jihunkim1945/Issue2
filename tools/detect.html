<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WATCHMAN — Detection Tool</title>
<!--
  WATCHMAN — make tracking boxes for the CCTV clips (run once, not part of the site)

  1. Start the local server (as for the site) and open  tools/detect.html
  2. Press RUN. Every clip in assets/video/cctv is scanned 5 times a second
     with an object detector (TensorFlow.js COCO-SSD, Apache-2.0 licence).
  3. Press DOWNLOAD and save the file as  assets/video/cctv/tracks.json
  The site then draws boxes that follow the real people and cars.
  Added or changed clips? Run it again.
-->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<style>
  :root { --bg: #f2f0eb; --fg: #111; }
  body { margin: 0; padding: 24px; background: var(--bg); color: var(--fg); font: 12px/1.5 "Courier New", monospace; text-transform: uppercase; }
  button { font: inherit; border: 1px solid var(--fg); background: none; padding: 6px 10px; cursor: pointer; margin-right: 6px; }
  button:hover { background: var(--fg); color: var(--bg); }
  .wrap { display: grid; grid-template-columns: 640px 1fr; gap: 24px; margin-top: 16px; }
  canvas { width: 640px; height: 480px; background: #000; display: block; }
  pre { margin: 0; white-space: pre-wrap; max-height: 480px; overflow: auto; }
</style>
</head>
<body>
  <p># WATCHMAN / DETECTION TOOL — TF.JS COCO-SSD</p>
  <button id="run" type="button">RUN</button>
  <button id="dl" type="button" disabled>DOWNLOAD tracks.json</button>
  <div class="wrap">
    <canvas id="view" width="320" height="240"></canvas>
    <pre id="log"></pre>
  </div>
<script>
const CLIPS = 18;             // assets/video/cctv/cctv-01.mp4 … cctv-18.mp4
const FPS = 5;                // detections per second of video
const KEEP = ['person', 'car', 'bicycle', 'motorcycle', 'bus', 'truck'];
const MIN_SCORE = .3;
const TILED = true;           // also look at 4 zoomed-in quarters → finds small, far-away people (slower)

// zoomed quarters (60% of the frame each, overlapping) → detections mapped back to the full frame
const crop = document.createElement('canvas'); crop.width = 320; crop.height = 240;
const cctx = crop.getContext('2d');
async function detectAll(model, v) {
  const W = v.videoWidth, H = v.videoHeight;
  let all = (await model.detect(v, 20, MIN_SCORE)).map(d => ({ ...d, bbox: d.bbox.map((b, i) => b / (i % 2 ? H : W)) }));
  if (TILED) {
    for (const [ox, oy] of [[0, 0], [.4, 0], [0, .4], [.4, .4]]) {
      cctx.drawImage(v, ox * W, oy * H, .6 * W, .6 * H, 0, 0, 320, 240);
      const det = await model.detect(crop, 20, MIN_SCORE);
      det.forEach(d => all.push({ ...d, bbox: [ox + d.bbox[0] / 320 * .6, oy + d.bbox[1] / 240 * .6, d.bbox[2] / 320 * .6, d.bbox[3] / 240 * .6] }));
    }
  }
  // merge duplicates (same class, overlapping a lot) — keep the more confident one
  all = all.filter(d => KEEP.includes(d.class)).sort((a, b) => b.score - a.score);
  const iou = (a, b) => {
    const x1 = Math.max(a[0], b[0]), y1 = Math.max(a[1], b[1]), x2 = Math.min(a[0] + a[2], b[0] + b[2]), y2 = Math.min(a[1] + a[3], b[1] + b[3]);
    const inter = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
    return inter / (a[2] * a[3] + b[2] * b[3] - inter);
  };
  const out = [];
  all.forEach(d => { if (!out.some(o => o.class === d.class && iou(o.bbox, d.bbox) > .45)) out.push(d); });
  return out;
}

const log = t => { const l = document.getElementById('log'); l.textContent += t + '\n'; l.scrollTop = l.scrollHeight; };
const view = document.getElementById('view'), vctx = view.getContext('2d');
const seek = (v, t) => new Promise(r => { v.onseeked = () => r(); v.currentTime = t; });
const r3 = n => Math.round(n * 1000) / 1000;
let result = null;

async function run() {
  document.getElementById('run').disabled = true;
  log('> LOADING MODEL…');
  const model = await cocoSsd.load({ base: 'mobilenet_v2' });
  const tracks = { fps: FPS, clips: {} };
  for (let n = 1; n <= CLIPS; n++) {
    const v = document.createElement('video');
    v.muted = true; v.preload = 'auto';
    v.src = `../assets/video/cctv/cctv-${String(n).padStart(2, '0')}.mp4`;
    try { await new Promise((ok, no) => { v.onloadeddata = ok; v.onerror = no; }); }
    catch { log(`cctv-${n}: not found — skipped`); continue; }
    const W = v.videoWidth, H = v.videoHeight, frames = [];
    let found = 0;
    for (let t = 0; t < v.duration - .05; t += 1 / FPS) {
      await seek(v, t);
      const det = await detectAll(model, v);
      // [class, score, x, y, w, h] — positions 0–1
      frames.push(det.map(d => [d.class, r3(d.score), ...d.bbox.map(r3)]));
      found += det.length;
      vctx.drawImage(v, 0, 0, 320, 240);
      vctx.strokeStyle = '#fff'; vctx.fillStyle = '#fff'; vctx.font = '9px sans-serif';
      det.forEach(d => { const [x, y, w, h] = d.bbox; vctx.strokeRect(x * 320, y * 240, w * 320, h * 240); vctx.fillText(`${d.class} ${d.score.toFixed(2)}`, x * 320, y * 240 - 2); });
    }
    tracks.clips[n] = frames;
    log(`cctv-${String(n).padStart(2, '0')}: ${frames.length} frames, ${found} boxes`);
  }
  result = tracks;
  window.TRACKS_RESULT = JSON.stringify(tracks);
  log(`> DONE — ${(window.TRACKS_RESULT.length / 1024).toFixed(0)} KB`);
  document.getElementById('dl').disabled = false;
}

document.getElementById('run').onclick = () => run().catch(e => log('ERROR: ' + e.message));
document.getElementById('dl').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([window.TRACKS_RESULT], { type: 'application/json' }));
  a.download = 'tracks.json';
  a.click();
};
</script>
</body>
</html>
